<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stream bridge</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#p,iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<div id="p"></div>
<script>
/* 중계 페이지 (GitHub Pages 에 올려 https 주소로 씀 — 개인 데이터 없음)
   파일로 연 음원 플레이어(file://)는 주소가 없어 유튜브·니코니코 플레이어가 거부함 → 이 페이지가 대신 띄우고,
   재생 상태·시간을 부모 화면으로 보내고 부모의 명령(재생·멈춤·이동·소리)을 플레이어에 전함.
   주소: ?yt=<유튜브 영상 번호> 또는 ?nico=<sm…> (또는 ?sc=<SoundCloud 주소> · ?vimeo=<번호> · ?file=<음원 파일 주소> ·
   ?bili=<av…|BV…>&len=<초> — 원곡이 없어진 곡의 다른 링크, 2026-11-18) · &start=<초> · &mute=1 · &vol=<0~100> · &id=<부모가 구분하는 번호>
   · &guide=1: 비리비리 볼륨 가이드 — 소리 끈 채로 열어 둠, cmd guide false 로 소리 켜고 다시 엶 · &vs=1: 볼륨 스크립트가 있는 브라우저
   · &cmt=0: 니코니코 댓글 끄기 (기본 켬) · 유튜브 자막은 늘 끄고 시작
   · &info=1: 니코니코 영상 정보만 알리고 재생하지 않음 (플레이어 곡 정보 줄의 재생수)
   · cmd load {yt|nico, start, play}: next song in the same player (reused so playback goes on in a hidden tab)
   · ?ytlist=<재생목록 번호>: 재생 없이 그 재생목록의 영상 번호만 {ev: "list", ids}
   · 배속 (user request 2026-11-19): &rate=<배> · cmd rate. YouTube · 파일은 스스로, 니코니코 · SoundCloud · Vimeo · 비리비리는
     음원 플레이어 확장이 있을 때만 (그 플레이어 칸에 {mpx: 1, rate} — 확장이 영상의 playbackRate 를 바꿈)
   · {ev: "ext", v}: 이 브라우저의 음원 플레이어 확장 판 (0 = 없음) — 늘 맨 먼저 · ?probe=1: 그것만 알림
   · cmd fx {semis, level, vol, key, prior}: 키 변경 · 소리 크기 맞추기 — 확장 / 앱 스크립트(music_front js/player_ext_media.js)가
     있는 플레이어 칸에 그대로 전함 · 그 스크립트가 잰 소리 크기 {mpxLoud} → {ev: "loud", lufs, secs, key} (2026-11-19) */
const q = new URLSearchParams(location.search), id = q.get("id") || "";
const up = m => parent.postMessage({bridge: 1, ver: 4, id, ...m}, "*");  // ver 2: cmd "load" (YouTube) · ver 3: also Niconico · 4: rate, ext  // 부모는 파일로 연 화면 (origin 이 없음) → "*"
const EXT = +window.MPX_EXT || 0;  // set by the extension's bridge.js (document_start, before this)
up({ev: "ext", v: EXT});
const start = +q.get("start") || 0, startMuted = q.get("mute") === "1", startVol = q.has("vol") ? +q.get("vol") : 100;
let rate = +q.get("rate") || 1;  // 배속 — kept across "load" (the parent sends it again when it changes)
const extRate = () => EXT >= 2 ? rate : 1;  // players only the extension can speed up
let fx = {};  // 키 · 소리 크기 — kept across "load" like rate
let FR = null;  // the site's player frame: {el: () => iframe, origin}
const toFrame = () => { try { const f = FR && FR.el(); if (f) f.contentWindow.postMessage({mpx: 1, rate: extRate(), ...fx}, FR.origin); } catch (e) {} };
addEventListener("message", e => {  // the extension / app script measured this video's loudness
  const f = FR && FR.el();
  if (f && e.source === f.contentWindow && e.data && e.data.mpxLoud) up({ev: "loud", ...e.data.mpxLoud});
});
const comments = q.get("cmt") !== "0";  // 니코니코 댓글: 기본 켬 (&cmt=0 이면 끔)
let P = null;  // {play, pause, seek(초), volume(0~100), mute(bool), rate(배), comments(bool — 니코니코만)}

if (q.get("yt")) {
  const s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  s.onerror = () => up({ev: "error", code: "api"});
  document.head.appendChild(s);
  window.onYouTubeIframeAPIReady = () => {
    const STATE = {"-1": "buffering", 0: "ended", 1: "playing", 2: "paused", 3: "buffering", 5: "paused"};
    let ccOff = false, y = null, vid = q.get("yt"), from = Math.floor(start), retried = "", vol = startVol, muted = startMuted;
    // youtube-nocookie: 브라우저에 로그인된 유튜브 계정을 쓰지 않음 (다른 곳에서 같은 계정으로 듣는 중이어도 막히지 않게)
    // 101·150 (퍼가기 금지) 이 nocookie 에서 나면 그 영상만 www.youtube.com 플레이어로 한 번 더 — 그래도 안 되면 오류를 올림
    const make = (host, play = true) => { y = new YT.Player("p", {host, videoId: vid,
      playerVars: {autoplay: play ? 1 : 0, playsinline: 1, rel: 0, start: from, cc_load_policy: 0, controls: 0},  // no YouTube buttons (user request; the player has its own)
      events: {
        onReady: e => {
          if (muted) e.target.mute(); else { e.target.unMute(); e.target.setVolume(vol); }
          if (rate !== 1) e.target.setPlaybackRate(rate);
          toFrame();
          if (play) e.target.playVideo();
          up({ev: "ready", d: e.target.getDuration()});
        },
        onStateChange: e => {
          // 자막은 끔 — cc_load_policy:0 만으로는 영상 설정에 따라 켜져서, 처음 재생될 때 자막 모듈을 내림
          // (재생 직후 다시 올라오는 일이 있어 몇 번 더 · 그 뒤 자막 단추를 누르면 다시 켜짐)
          if (e.data === 1 && !ccOff) {
            ccOff = true;
            const off = () => { try { y.unloadModule("captions"); } catch (x) {} };
            off(); setTimeout(off, 1000); setTimeout(off, 3000);
          }
          if (e.data === 1 && y.getPlaybackRate() !== rate) y.setPlaybackRate(rate);  // a loaded video starts at 1
          up({ev: "state", s: STATE[e.data] || "buffering"});
        },
        onError: e => {  // 2·5·100·101·150: 없는 영상·퍼가기 금지 등
          if ((e.data === 101 || e.data === 150) && retried !== vid) { retried = vid; return remake("https://www.youtube.com", playing); }
          up({ev: "error", code: e.data});
        },
      }}); };
    let playing = true;  // the song should play (load {play}) — kept for the retry
    const remake = (host, play) => {
      try { y.destroy(); } catch (x) {}
      if (!document.getElementById("p")) { const d = document.createElement("div"); d.id = "p"; document.body.prepend(d); }
      ccOff = false; make(host, play);
    };
    FR = {el: () => y && y.getIframe && y.getIframe(), get origin() { return new URL(this.el().src).origin; }};
    make("https://www.youtube-nocookie.com");
    // load: next YouTube song in this same player. Chrome defers media in frames created while the tab is hidden
    // (until shown) → the parent keeps one YouTube bridge and reuses it, so songs go on while the user isn't looking.
    let want = "";  // video id loaded by "load" — "ready" is sent once its duration is known (state events don't come while folded)
    P = {play: () => y.playVideo(), pause: () => y.pauseVideo(), seek: t => y.seekTo(t, true),
         volume: v => { vol = v; y.setVolume(v); }, mute: on => { muted = on; on ? y.mute() : y.unMute(); },
         rate: r => { y.setPlaybackRate(r); toFrame(); }, fx: toFrame,
         load: v => {
           // a player remade on www.youtube.com stays so (a new frame in a hidden tab may stay silent)
           want = v.yt; vid = v.yt; from = Math.floor(+v.start || 0); playing = !!v.play; ccOff = false;
           const o = {videoId: v.yt, startSeconds: from}; if (v.play) y.loadVideoById(o); else y.cueVideoById(o);
         }};
    setInterval(() => {
      try {
        if (!y.getCurrentTime) return;
        if (want && (y.getVideoData() || {}).video_id === want && y.getDuration() > 0) { want = ""; up({ev: "ready", d: y.getDuration()}); }
        // 배속: a video loaded by "load" starts at 1 again and the state event that set it back doesn't come while folded
        // (user report 2026-11-20: OPEN CHANNEL 2x!! played at 1×) → checked here while it plays
        if (rate !== 1 && y.getPlayerState() === 1 && y.getPlaybackRate() !== rate) y.setPlaybackRate(rate);
        up({ev: "time", t: y.getCurrentTime(), d: y.getDuration()});
      } catch (e) {}
    }, 250);
  };
} else if (q.get("nico")) {
  // 니코니코 퍼가기 플레이어 (postMessage 로 조작 — playerId 로 구분)
  // cmd load {nico, start, play}: next Niconico song in the same embed frame (only its address changes).
  // User report: in Whale a new Niconico song started while another tab was in front stayed silent → keep one frame that has played.
  const f = document.createElement("iframe");
  f.allow = "autoplay; fullscreen";
  let cur = {nico: q.get("nico"), start, play: true}, vol = startVol, muted = startMuted, cmt = comments;
  const url = v => `https://embed.nicovideo.jp/watch/${encodeURIComponent(v.nico)}?jsapi=1&playerId=b&from=${Math.floor(+v.start || 0)}`;
  f.src = url(cur);
  document.getElementById("p").replaceWith(f);
  FR = {el: () => f, origin: "https://embed.nicovideo.jp"};
  const send = (eventName, data) => f.contentWindow.postMessage({eventName, data, playerId: "b", sourceConnectorType: 1}, "https://embed.nicovideo.jp");
  const STATE = {2: "playing", 3: "paused", 4: "ended"};
  let dur = 0;
  addEventListener("message", e => {
    if (e.origin !== "https://embed.nicovideo.jp" || e.source !== f.contentWindow || !e.data || !e.data.eventName) return;
    const d = e.data.data || {};
    switch (e.data.eventName) {
      case "loadComplete":
        dur = ((d.videoInfo || {}).lengthInSeconds) || 0;
        if (q.get("info")) { up({ev: "info", views: (d.videoInfo || {}).viewCount ?? null}); break; }  // 정보만: 재생 안 함
        send("commentVisibilityChange", {commentVisibility: cmt});  // 댓글(弾幕) — 플레이어의 💬 댓글 버튼
        if (muted) send("mute", {mute: true}); else { send("mute", {mute: false}); send("volumeChange", {volume: vol / 100}); }
        if (cur.start) send("seek", {time: cur.start * 1000});
        toFrame();
        if (cur.play) send("play");
        up({ev: "ready", d: dur, views: (d.videoInfo || {}).viewCount ?? null, vid: cur.nico});  // 재생수 (니코니코 퍼가기 플레이어가 알려 줌)
        break;
      case "playerStatusChange":
        up({ev: "state", s: STATE[d.playerStatus] || "buffering"});
        break;
      case "playerMetadataChange":
        up({ev: "time", t: (d.currentTime || 0) / 1000, d: dur});
        break;
      case "error":
        up({ev: "error", code: d.code || "error"});
        break;
    }
  });
  P = {play: () => send("play"), pause: () => send("pause"), seek: t => send("seek", {time: t * 1000}),
       volume: v => { vol = v; send("volumeChange", {volume: v / 100}); }, mute: on => { muted = on; send("mute", {mute: on}); },
       comments: on => { cmt = on; send("commentVisibilityChange", {commentVisibility: on}); },
       rate: toFrame, fx: toFrame,
       load: v => { if (!v.nico) return; cur = {nico: v.nico, start: +v.start || 0, play: !!v.play}; dur = 0; f.contentWindow.location.replace(url(cur)); }};  // replace: no history entry per song (phone app's back button stepped the video back — user report)
} else if (q.get("sc")) {
  // SoundCloud (user request 2026-11-18: the song's other links when the original is gone) — Widget API
  const f = document.createElement("iframe");
  f.allow = "autoplay";
  f.src = `https://w.soundcloud.com/player/?url=${encodeURIComponent(q.get("sc"))}&auto_play=false&visual=true&show_comments=false&buying=false&sharing=false&download=false&show_teaser=false`;
  document.getElementById("p").replaceWith(f);
  FR = {el: () => f, origin: "https://w.soundcloud.com"};
  const s = document.createElement("script");
  s.src = "https://w.soundcloud.com/player/api.js";
  s.onerror = () => up({ev: "error", code: "api"});  // also what an ad blocker that blocks it looks like → next source
  document.head.appendChild(s);
  s.onload = () => {
    const w = SC.Widget(f), E = SC.Widget.Events;
    let vol = startVol, muted = startMuted, dur = 0;
    w.bind(E.READY, () => {
      w.setVolume(muted ? 0 : vol);
      w.getDuration(ms => {
        dur = (+ms || 0) / 1000;
        if (start) w.seekTo(start * 1000);
        toFrame();
        w.play();
        up({ev: "ready", d: dur});
      });
    });
    w.bind(E.PLAY, () => up({ev: "state", s: "playing"}));
    w.bind(E.PAUSE, () => up({ev: "state", s: "paused"}));
    w.bind(E.FINISH, () => up({ev: "state", s: "ended"}));
    w.bind(E.PLAY_PROGRESS, e => up({ev: "time", t: (+e.currentPosition || 0) / 1000, d: dur}));
    w.bind(E.ERROR, () => up({ev: "error", code: "sc"}));
    P = {play: () => w.play(), pause: () => w.pause(), seek: t => w.seekTo(t * 1000),
         volume: v => { vol = v; if (!muted) w.setVolume(v); }, mute: on => { muted = on; w.setVolume(on ? 0 : vol); },
         rate: toFrame, fx: toFrame};
  };
} else if (q.get("vimeo")) {
  // Vimeo — Player API (player.js)
  const s = document.createElement("script");
  s.src = "https://player.vimeo.com/api/player.js";
  s.onerror = () => up({ev: "error", code: "api"});
  document.head.appendChild(s);
  s.onload = () => {
    const v = new Vimeo.Player("p", {id: +q.get("vimeo"), autoplay: true, muted: startMuted, dnt: true, title: false, byline: false, portrait: false, responsive: true});
    let dur = 0, vol = startVol;
    // its own setPlaybackRate works only for videos of paid accounts → else the extension
    FR = {el: () => document.querySelector("iframe"), origin: "https://player.vimeo.com"};
    const vrate = () => { v.setPlaybackRate(rate).catch(toFrame); };
    v.on("play", () => up({ev: "state", s: "playing"}));
    v.on("pause", () => up({ev: "state", s: "paused"}));
    v.on("ended", () => up({ev: "state", s: "ended"}));
    v.on("timeupdate", e => up({ev: "time", t: +e.seconds || 0, d: +e.duration || dur}));
    v.on("error", () => up({ev: "error", code: "vimeo"}));
    v.ready().then(async () => {
      dur = await v.getDuration().catch(() => 0);
      v.setVolume(vol / 100).catch(() => {});
      if (rate !== 1) vrate();
      toFrame();
      if (start) v.setCurrentTime(start).catch(() => {});  // never awaited: before the first play it may not answer (tested)
      v.play().catch(() => {});  // blocked autoplay: the parent's ▶ sends play again
      up({ev: "ready", d: dur});
    }).catch(() => up({ev: "error", code: "vimeo"}));  // deleted · private · not embeddable
    P = {play: () => v.play().catch(() => {}), pause: () => v.pause().catch(() => {}), seek: t => v.setCurrentTime(t).catch(() => {}),
         volume: x => { vol = x; v.setVolume(x / 100).catch(() => {}); }, mute: on => v.setMuted(on).catch(() => {}), rate: vrate, fx: toFrame};
  };
} else if (q.get("file")) {
  // a plain audio file (VocaDB 'LocalFile' · 'File' links)
  const a = new Audio();
  a.preload = "auto"; a.volume = startVol / 100; a.muted = startMuted; a.defaultPlaybackRate = a.playbackRate = rate;
  a.addEventListener("loadedmetadata", () => { if (start) a.currentTime = start; a.play().catch(() => {}); up({ev: "ready", d: a.duration || 0}); }, {once: true});
  a.addEventListener("playing", () => up({ev: "state", s: "playing"}));
  a.addEventListener("pause", () => { if (!a.ended) up({ev: "state", s: "paused"}); });
  a.addEventListener("ended", () => up({ev: "state", s: "ended"}));
  a.addEventListener("error", () => up({ev: "error", code: "file"}));
  setInterval(() => { if (a.readyState) up({ev: "time", t: a.currentTime, d: a.duration || 0}); }, 250);
  a.src = q.get("file");
  P = {play: () => a.play().catch(() => {}), pause: () => a.pause(), seek: t => { a.currentTime = t; },
       volume: v => { a.volume = Math.max(0, Math.min(1, v / 100)); }, mute: on => { a.muted = on; },
       rate: r => { a.defaultPlaybackRate = a.playbackRate = r; }};
} else if (q.get("bili")) {
  // Bilibili: its embed player has no API — it takes no command and tells nothing (tested 2026-11-18). So it plays only
  // while it should be heard: pause / mute = the frame is emptied, play / seek = reopened at that second (&t=).
  // Time is counted here from when the frame loaded; the end = the length the parent got from VocaDB (&len=).
  // Its player keeps the volume set inside it (its own storage, per browser) but takes none from us — except through the
  // user script the player's guide hands out (user request 2026-11-18, Tampermonkey): it listens in the Bilibili frame for
  // {biliVol: 0~1 | null} and answers {biliVolAck: 1}; Bilibili's player.setVolume also unmutes.
  // &guide=1: the frame opens muted (&muted=1 — Bilibili doesn't save the mute) and stays open even while the parent is muted;
  //   only pings (biliVol null) are sent, so nothing unmutes it. cmd guide false = reopen with sound.
  // &vs=1 (script installed earlier): opens muted too, the script unmutes it at our volume (no loud first moment);
  //   no answer within 6 s → {ev: "novolctl"} and reopened without the mute (plays at its own saved volume).
  // An answer → {ev: "volctl"} (once). cmd reload = reopen the frame (a just-saved script runs only in a new page).
  const bid = q.get("bili"), len = +q.get("len") || 0;
  let guide = q.get("guide") === "1", vs = q.get("vs") === "1", vol = startVol, acked = false, loadedAt = 0;
  const f = document.createElement("iframe");
  f.allow = "autoplay; fullscreen";
  document.getElementById("p").replaceWith(f);
  FR = {el: () => f, origin: "https://player.bilibili.com"};
  const src = t => `https://player.bilibili.com/player.html?${/^bv/i.test(bid) ? "bvid=" + bid : "aid=" + bid.replace(/^av/i, "")}&page=1&autoplay=1&danmaku=0&high_quality=1&t=${Math.floor(t)}${guide || vs ? "&muted=1" : ""}`;
  const tell = () => { if (open && loadedAt) { try { f.contentWindow.postMessage({biliVol: guide ? null : vol / 100}, "https://player.bilibili.com"); } catch (e) {} toFrame(); } };
  addEventListener("message", e => {
    if (e.source !== f.contentWindow || !e.data || !e.data.biliVolAck || acked) return;
    acked = true; up({ev: "volctl"});
  });
  let base = start, at = 0, playing = true, muted = startMuted, open = false;
  const now = () => playing && at ? base + (performance.now() - at) / 1000 * extRate() : base;  // its time runs at the speed
  const freeze = () => { base = now(); at = 0; };
  // heard → frame open (time runs from its load) · silent → frame empty, time runs on its own while playing (priming)
  const show = () => {
    const want = playing && (!muted || guide);
    if (want && !open) { open = true; freeze(); loadedAt = 0; f.onload = () => { if (open) { at = loadedAt = performance.now(); tell(); } }; f.src = src(base); }
    else if (!want && open) { freeze(); open = false; loadedAt = 0; f.onload = null; f.src = "about:blank"; if (playing) at = performance.now(); }
  };
  const reopen = () => { if (open) { freeze(); open = false; loadedAt = 0; f.onload = null; f.src = "about:blank"; if (playing) at = performance.now(); } show(); };
  let lastState = "";
  const state = s => { if (s !== lastState) { lastState = s; up({ev: "state", s}); } };
  if (!len) up({ev: "error", code: "no-length"});
  else {
    if (muted) at = performance.now();
    show();
    up({ev: "ready", d: len});
    let tick = 0;
    setInterval(() => {
      if (playing && now() >= len) { base = len; at = 0; playing = false; show(); state("ended"); }
      else if (playing && at) state("playing");
      up({ev: "time", t: Math.min(now(), len), d: len});
      if (!acked && ++tick % 4 === 0) tell();  // the script may come up after the load
      if (vs && !acked && loadedAt && performance.now() - loadedAt > 6000) { vs = false; up({ev: "novolctl"}); reopen(); }
    }, 250);
    P = {play: () => { if (playing) return; if (base >= len) base = 0; playing = true; if (muted) at = performance.now(); show(); },
         pause: () => { if (!playing) return; freeze(); playing = false; show(); state("paused"); },
         seek: t => { base = Math.max(0, Math.min(+t || 0, len)); at = 0; if (playing) { if (open) { open = false; show(); } else at = performance.now(); } },
         volume: v => { vol = Math.max(0, Math.min(100, +v || 0)); tell(); }, mute: on => { muted = on; show(); },
         guide: on => { if (guide === !!on) return; guide = !!on; vs = vs || (!guide && acked); reopen(); },
         rebase: () => { if (at) { base = now(); at = performance.now(); } },  // before the speed changes: time so far at the old one
         rate: tell, fx: tell,
         reload: reopen};
  }
} else if (q.get("probe")) {
  // only the {ev: "ext"} above (the player's 다 했어요 check)
} else if (q.get("ytlist")) {
  // ?ytlist=<유튜브 재생목록 번호>: 그 재생목록의 영상 번호만 알림 {ev: "list", ids} — 재생 안 함
  // (플레이어 오프라인 모드의 유튜브 재생목록 — user request 2026-11-15; 플레이어 화면은 youtube.com 을 직접 못 읽음)
  const s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  s.onerror = () => up({ev: "error", code: "api"});
  document.head.appendChild(s);
  window.onYouTubeIframeAPIReady = () => {
    new YT.Player("p", {host: "https://www.youtube-nocookie.com", playerVars: {listType: "playlist", list: q.get("ytlist"), autoplay: 0, controls: 0},
      events: {onReady: e => {
        let n = 0;
        const t = setInterval(() => {
          const l = e.target.getPlaylist();
          if ((l && l.length) || ++n > 40) { clearInterval(t); up(l && l.length ? {ev: "list", ids: l} : {ev: "error", code: "empty"}); }
        }, 250);
      }}});
  };
} else {
  up({ev: "error", code: "no-video"});
}

// 부모의 명령 {cmd: play|pause|seek|volume|mute|comments, v}
addEventListener("message", e => {
  if (e.source !== parent || !e.data || !e.data.cmd) return;
  const {cmd, v} = e.data;
  if (cmd === "fx") { fx = {...fx, ...(v || {})}; try { if (P && P.fx) P.fx(); } catch (x) {} return; }
  if (cmd === "rate") {  // kept even before the player is up (P null) — each player applies it once ready
    const r = Math.max(0.25, Math.min(4, +v || 1));
    if (r === rate) return;
    if (P && P.rebase) P.rebase();
    rate = r;
    try { if (P && P.rate) P.rate(r); } catch (x) {}
    return;
  }
  if (!P) return;
  try { if (cmd === "load") { if (P.load) P.load(v || {}); } else if (cmd === "seek") P.seek(+v); else if (cmd === "volume") P.volume(+v); else if (cmd === "mute" || cmd === "comments" || cmd === "guide") { if (P[cmd]) P[cmd](!!v); } else if (P[cmd]) P[cmd](); } catch (x) {}
});
</script>
