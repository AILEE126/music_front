<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가사 오버레이</title>
<!-- 폰 앱의 떠 있는 가사 창 (user request 2026-11-15: 알송 모바일처럼 다른 앱 위에 가사).
     The app (music_app PlayerService) shows this page in a small transparent window over other apps and calls
     ovNow(<same body as the PC overlay's /api/now>) · ovSet(<가사 오버레이 설정>). Looks like tools/lyrics_overlay.ps1:
     song line, original bold (vocal colors, several = top→bottom gradient), reading / translation smaller, black outline.
     Drag up/down to move · double tap opens the player. -->
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; -webkit-user-select: none; user-select: none; touch-action: none; }
  /* kana · kanji from one Japanese font (user request 2026-11-19, as the player's #lyrics): kanji and kana were different sizes */
  @font-face { font-family: CscJa; font-weight: 100 500; unicode-range: U+3000-30FF,U+31F0-31FF,U+3400-4DBF,U+4E00-9FFF,U+F900-FAFF,U+FF00-FFEF,U+20000-3FFFF;
    src: local("Noto Sans CJK JP"), local("NotoSansCJKjp-Regular"), local("Noto Sans JP"), local("Hiragino Sans W4"), local("HiraginoSans-W4"), local("Yu Gothic Medium"), local("YuGothic-Medium"); }
  @font-face { font-family: CscJa; font-weight: 600 900; unicode-range: U+3000-30FF,U+31F0-31FF,U+3400-4DBF,U+4E00-9FFF,U+F900-FAFF,U+FF00-FFEF,U+20000-3FFFF;
    src: local("Noto Sans CJK JP Bold"), local("NotoSansCJKjp-Bold"), local("Noto Sans JP Bold"), local("Hiragino Sans W6"), local("HiraginoSans-W6"), local("Yu Gothic Bold"), local("YuGothic-Bold"); }
  #box { padding: 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 0; font-family: system-ui, CscJa, "Malgun Gothic", sans-serif; }
  .ln { position: relative; text-align: center; line-height: 1.15;  /* tighter, same as the PC overlay (user request 2026-11-19) */ max-width: 100%; overflow-wrap: anywhere; }
  .ln span { display: block; }
  /* 불투명도: outline + letters turn see-through as one layer (.grp). The opaque white copy under the letters (2026-11-18)
     was dropped — it stayed white at any opacity (user report 2026-11-19) */
  .ln .edge { position: absolute; inset: 0; }
  .ln .grp { position: relative; }
  .cols { display: flex; justify-content: center; align-items: flex-start; gap: 0 1.6em; max-width: 100%; }
  .col { display: flex; flex-direction: column; align-items: center; min-width: 0; flex: 0 1 auto; }
  .ln .edge { color: transparent; -webkit-text-stroke: var(--o) #000; }
  .ln .fill { position: relative; color: var(--c, #fff); }
  .ln.grad .fill { color: transparent; background: var(--g); -webkit-background-clip: text; background-clip: text; }
  /* player in light mode (now.light — user request 2026-11-18): white outline, dark text, vocal colors darkened like the player */
  body.light .ln .edge { -webkit-text-stroke-color: #fff; }
  body.light .ln .fill { color: color-mix(in srgb, var(--c, #fff) 62%, #000); }
  body.light .ln:not([style*="--c:"]) .fill { color: #323238; }
  body.light .ln.grad .fill { color: transparent; filter: brightness(.62); }
</style>
</head>
<body>
<div id="box"></div>
<script>
let now = {}, set = {size: 22, info_size: 12, outline: 2, opacity: 100, info: true, width: 1100};
const box = document.getElementById("box"), app = window.AppOverlay;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);

function line(text, size, weight, opacity, colors) {
  const cs = (colors || []).filter(c => /^#[0-9a-f]{6}$/i.test(c));
  const a = opacity * Math.max(0.1, Math.min(1, (+set.opacity || 100) / 100));
  const style = `font-size:${size}px;font-weight:${weight};--o:${2 * Math.max(0, +set.outline || 0)}px;`
    + (cs.length === 1 ? `--c:${cs[0]};` : cs.length > 1 ? `--g:linear-gradient(to bottom,${cs.join(",")});` : "");
  return `<div class="ln${cs.length > 1 ? " grad" : ""}" style="${style}"><span class="grp" style="opacity:${a}"><span class="edge">${esc(text)}</span><span class="fill">${esc(text)}</span></span></div>`;
}
/* one block of lines (role o · r · t · x) in one set of colors */
function lyrBlock(ls, s, colors, d) {
  let h = "";
  for (const l of ls || []) {
    // every lyric line one size (user request 2026-11-19 — a Korean- or English-only song = the Japanese line's size)
    if (l.role === "o") h += line(l.text, s, 700, 1, colors);
    else if (l.role === "r" && d.show_r) h += line(l.text, s, 600, 0.85, colors);
    else if ((l.role === "t" && d.show_t) || l.role === "x") h += line(l.text, s, 600, 1, colors);
  }
  return h;
}
/* 파트 (user request 2026-11-19): the part's name small above its lyrics, in the part's colors */
const partLine = (p, s) => p && p.name ? line(p.name, Math.max(9, Math.round(s * 0.5)), 700, 0.9, p.colors || p.pcolors) : "";
function render() {
  const s = Math.max(6, +set.size || 22), d = now;
  box.style.maxWidth = `${Math.max(200, +set.width || 1100)}px`;
  box.style.margin = "0 auto";
  document.body.classList.toggle("light", !!(d && d.light));
  let h = "";
  if (d && d.title) {
    if (set.info !== false) h += line(d.artist ? `${d.title} — ${d.artist}` : d.title, Math.max(6, +set.info_size || 12), 600, 0.9, [])  // own size setting (user request 2026-11-19, was size × 0.55);
    // several singers at once: side by side, each centred on its own, a gap between, no '／' (user request 2026-11-19)
    if (d.cols && d.cols.length > 1) h += `<div class="cols" style="column-gap:${Math.round(s * 1.5)}px">${d.cols.map(c => `<div class="col">${partLine({name: c.name, colors: c.pcolors}, s)}${lyrBlock(c.lines, s, c.colors, d)}</div>`).join("")}</div>`;
    else h += partLine(d.part, s) + lyrBlock(d.lines, s, d.colors, d);
  }
  box.innerHTML = h;
  report();
}
const report = () => { if (app) app.height(box.innerHTML ? box.offsetHeight : 1); };
window.ovNow = d => { now = d || {}; render(); };
window.ovSet = c => { set = {...set, ...(c || {})}; render(); useFonts(); };

/* 글꼴 (user request 2026-11-18): the player's ⚙ 글꼴 picks — font_ja / font_etc name the picked file; the player keeps the
   file in IndexedDB music-fonts (slots ja · etc, {sha, file, buf}) and this page has the same origin, so it reads it there.
   Ranges as in the player's js/font_setting.js (Japanese pick = kana · kanji, the other = the rest) */
const FONT_RANGE = {
  ja: "U+3000-30FF,U+31F0-31FF,U+3400-4DBF,U+4E00-9FFF,U+F900-FAFF,U+FF00-FFEF,U+20000-3FFFF",
  etc: "U+0-2FFF,U+3100-31EF,U+3200-33FF,U+4DC0-4DFF,U+A000-F8FF,U+FB00-FEFF,U+FFF0-FFFF,U+10000-1FFFF,U+40000-10FFFF",
};
const fonts = {};  // k → {file, face}
const fontSlot = k => new Promise(res => {
  const q = indexedDB.open("music-fonts", 1);
  q.onupgradeneeded = () => q.result.createObjectStore("kv");
  q.onerror = () => res(null);
  q.onsuccess = () => { const r = q.result.transaction("kv").objectStore("kv").get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(null); };
});
async function useFonts() {
  for (const k of ["ja", "etc"]) {
    const want = set["font_" + k] || "", bold = !!set["font_bold_" + k], old = fonts[k];
    if ((old ? old.file : "") === want && (!old || old.bold === bold)) continue;
    if (old) document.fonts.delete(old.face);
    fonts[k] = null;
    const hit = want ? await fontSlot(k) : null;
    if (!hit || hit.file !== want) continue;
    try {
      // not bold (the player's ⚙ 글꼴 굵게 off, user request 2026-11-19): one face for every weight → no fake bold
      const face = new FontFace(k === "ja" ? "CscFontJa" : "CscFontEtc", hit.buf, {unicodeRange: FONT_RANGE[k], ...(bold ? {} : {weight: "100 900"})});
      await face.load(); document.fonts.add(face); fonts[k] = {file: want, face, bold};
    } catch (e) {}
  }
  box.style.fontFamily = [fonts.ja && '"CscFontJa"', fonts.etc && '"CscFontEtc"', "system-ui", "CscJa", '"Malgun Gothic"', "sans-serif"].filter(Boolean).join(",");
  report();
}

// drag up/down to move the window · double tap → player
let y0 = null, moved = false, lastTap = 0;
addEventListener("pointerdown", e => { y0 = e.screenY; moved = false; });
addEventListener("pointermove", e => {
  if (y0 == null) return;
  const dy = e.screenY - y0;
  if (Math.abs(dy) < 2) return;
  moved = true; y0 = e.screenY;
  if (app) app.move(dy);
});
addEventListener("pointerup", () => {
  if (y0 == null) return;
  y0 = null;
  if (moved) { if (app) app.moved(); return; }
  if (Date.now() - lastTap < 350 && app) app.openApp();
  lastTap = Date.now();
});
new ResizeObserver(report).observe(box);
if (app) app.ready();
</script>
</body>
</html>
